<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Devocional 365 - Mobile Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #000000;
            --text-primary: #FFFFFF;
            --accent: #FFFF00; 
            --recording: #FF3B30;
            --paused: #FF9500;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        /* Evitar zoom automático en inputs en iOS */
        input, textarea, select {
            font-size: 16px !important;
        }

        .high-contrast-btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 800;
            padding: 0.8rem;
            border-radius: 12px;
            text-transform: uppercase;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 100%;
            min-height: 50px;
        }

        .btn-record { background-color: #2563eb; color: white; border: none; }
        .btn-pause { background-color: var(--paused); color: black; border: none; }
        .btn-save { background-color: #059669; color: white; border: none; }

        .recording-active {
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .devotional-card {
            border: 3px solid var(--accent);
            padding: 1.2rem;
            border-radius: 20px;
            background-color: #0a0a0a;
        }

        .note-card {
            background-color: #161616;
            border-left: 6px solid var(--accent);
            padding: 1rem;
            margin-top: 0.8rem;
            border-radius: 10px;
        }

        .transcript-preview {
            background-color: #111;
            border: 1px dashed #555;
            padding: 0.8rem;
            border-radius: 10px;
            min-height: 50px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body class="p-3 md:p-8">

    <header class="max-w-xl mx-auto mb-4 text-center">
        <h1 class="text-3xl font-black mb-4 tracking-tight">Devocional 365</h1>
        
        <div class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="leerDevocional()" class="high-contrast-btn text-sm">🔊 Escuchar</button>
            <button onclick="detenerVoz()" class="high-contrast-btn bg-white text-sm">🛑 Parar</button>
        </div>

        <section class="bg-zinc-900 p-3 rounded-xl flex items-center justify-between border border-zinc-700">
            <button onclick="navegarFecha(-1)" class="p-2 text-xl">⬅️</button>
            <div class="text-center">
                <p id="fecha-display" class="font-bold text-yellow-400 text-sm">Cargando...</p>
            </div>
            <button onclick="navegarFecha(1)" class="p-2 text-xl">➡️</button>
        </section>
    </header>

    <main class="max-w-xl mx-auto space-y-4">
        <article id="devocional-contenedor" class="devotional-card">
            <h2 id="dev-titulo" class="text-xl font-bold mb-1 text-yellow-400">Cargando...</h2>
            <p id="dev-cita" class="text-sm italic mb-3 text-zinc-500"></p>
            <div id="dev-cuerpo" class="text-lg font-medium leading-snug"></div>
        </article>

        <!-- REFLEXIÓN POR VOZ -->
        <section class="p-5 bg-zinc-900 rounded-2xl border border-blue-900 shadow-lg">
            <h2 class="text-lg font-bold mb-3 flex items-center gap-2">🎤 Nota de Voz</h2>
            
            <div class="space-y-3">
                <div id="status-badge" class="text-center text-xs font-bold text-zinc-500">Listo para grabar</div>

                <div id="area-transcripcion" class="transcript-preview" aria-live="polite">
                    Pulsa Grabar para empezar...
                </div>

                <div class="flex flex-col gap-2">
                    <button id="btn-start" onclick="iniciarGrabacion()" class="high-contrast-btn btn-record">
                        INICIAR GRABACIÓN
                    </button>
                    
                    <div id="controles-activos" class="hidden grid grid-cols-2 gap-2">
                        <button id="btn-pause" onclick="pausarGrabacion()" class="high-contrast-btn btn-pause">⏸️ PAUSA</button>
                        <button id="btn-save" onclick="finalizarYGuardarVoz()" class="high-contrast-btn btn-save">💾 GUARDAR</button>
                    </div>
                    
                    <button id="btn-cancel" onclick="cancelarGrabacion()" class="text-red-500 text-xs font-bold underline text-center hidden">
                        CANCELAR
                    </button>
                </div>
            </div>
        </section>

        <!-- REFLEXIÓN ESCRITA -->
        <section class="p-5 bg-zinc-900 rounded-2xl border border-indigo-900">
            <h2 class="text-lg font-bold mb-3 flex items-center gap-2">✏️ Reflexión Escrita</h2>
            <textarea id="texto-reflexion" rows="3" placeholder="Escribe aquí..."></textarea>
            <button onclick="guardarReflexionEscrita()" class="high-contrast-btn mt-2 bg-indigo-600 text-white border-none text-sm">
                GUARDAR TEXTO
            </button>
        </section>

        <!-- HISTORIAL -->
        <div class="pt-2">
            <h3 class="text-md font-bold mb-3 text-zinc-400 uppercase tracking-widest text-center">Historial de Hoy</h3>
            <div id="lista-notas" class="space-y-3 pb-10"></div>
        </div>
    </main>

    <script>
        const temas = [
            { t: "Gracia Renovada", c: "Lamentaciones 3:22", m: "Sus misericordias son nuevas cada mañana. Hoy tienes una oportunidad fresca." },
            { t: "Fuerza en la Debilidad", c: "2 Corintios 12:9", m: "Mi gracia es suficiente para ti. Mi poder se perfecciona en tu debilidad." },
            { t: "Guía Segura", c: "Juan 16:13", m: "El Espíritu de verdad os guiará a toda la verdad. Confía en su voz hoy." }
        ];

        let fechaActual = new Date();
        let dbReflexiones = JSON.parse(localStorage.getItem('dev_reflexiones_v7') || '{}');
        const synth = window.speechSynthesis;
        
        let recognition = null;
        let transcriptAcumulado = "";
        let esPausaManual = false;

        function setupSpeech() {
            // Re-instanciar siempre para evitar errores de objeto "muerto" en móvil
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta grabación de voz.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'es-ES';
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
                document.getElementById('status-badge').innerText = "🔴 ESCUCHANDO...";
                document.getElementById('status-badge').className = "text-center text-xs font-bold text-red-500";
            };

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        transcriptAcumulado += event.results[i][0].transcript + " ";
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                document.getElementById('area-transcripcion').innerText = transcriptAcumulado + interim;
            };

            rec.onerror = (e) => {
                console.error("Error Speech:", e.error);
                if (e.error === 'not-allowed') alert("Permite el acceso al micrófono en ajustes.");
                actualizarUIVoz(false);
            };

            rec.onend = () => {
                if (!esPausaManual) actualizarUIVoz(false);
            };

            return rec;
        }

        function iniciarGrabacion() {
            synth.cancel();
            esPausaManual = false;
            
            // Re-creamos el objeto en cada inicio para limpiar estados de error en móvil
            recognition = setupSpeech();
            if (recognition) {
                try {
                    recognition.start();
                    actualizarUIVoz(true);
                } catch(e) {
                    console.error("Error al iniciar rec:", e);
                }
            }
        }

        function pausarGrabacion() {
            if (recognition) {
                esPausaManual = true;
                recognition.stop();
                document.getElementById('status-badge').innerText = "⏸️ PAUSADO";
                document.getElementById('status-badge').className = "text-center text-xs font-bold text-orange-500";
                document.getElementById('btn-start').innerText = "REANUDAR";
                document.getElementById('btn-start').classList.remove('hidden');
                document.getElementById('controles-activos').classList.add('hidden');
            }
        }

        function finalizarYGuardarVoz() {
            if (transcriptAcumulado.trim()) {
                guardarEnDB(transcriptAcumulado.trim(), 'voz');
                cancelarGrabacion();
            }
        }

        function cancelarGrabacion() {
            esPausaManual = false;
            if (recognition) try { recognition.stop(); } catch(e){}
            transcriptAcumulado = "";
            document.getElementById('area-transcripcion').innerText = "Pulsa Grabar para empezar...";
            document.getElementById('btn-start').innerText = "INICIAR GRABACIÓN";
            actualizarUIVoz(false);
        }

        function actualizarUIVoz(grabando) {
            const btnStart = document.getElementById('btn-start');
            const controles = document.getElementById('controles-activos');
            const btnCancel = document.getElementById('btn-cancel');

            if (grabando) {
                btnStart.classList.add('hidden');
                controles.classList.remove('hidden');
                btnCancel.classList.remove('hidden');
                controles.classList.add('recording-active');
            } else {
                if (!esPausaManual) {
                    btnStart.classList.remove('hidden');
                    controles.classList.add('hidden');
                    btnCancel.classList.add('hidden');
                    document.getElementById('status-badge').innerText = "Listo para grabar";
                    document.getElementById('status-badge').className = "text-center text-xs font-bold text-zinc-500";
                }
            }
        }

        function guardarReflexionEscrita() {
            const text = document.getElementById('texto-reflexion').value.trim();
            if (text) {
                guardarEnDB(text, 'texto');
                document.getElementById('texto-reflexion').value = '';
            }
        }

        function guardarEnDB(texto, tipo) {
            const iso = fechaActual.toISOString().split('T')[0];
            if (!dbReflexiones[iso]) dbReflexiones[iso] = [];
            dbReflexiones[iso].push({
                id: Date.now(),
                texto: texto,
                tipo: tipo,
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            localStorage.setItem('dev_reflexiones_v7', JSON.stringify(dbReflexiones));
            cargarNotas();
            anunciar("Guardado");
        }

        function cargarNotas() {
            const iso = fechaActual.toISOString().split('T')[0];
            const notas = dbReflexiones[iso] || [];
            const lista = document.getElementById('lista-notas');
            lista.innerHTML = notas.length ? '' : '<p class="text-center text-zinc-600 text-sm">Sin notas hoy.</p>';
            
            notas.slice().reverse().forEach(n => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.innerHTML = `
                    <p class="text-[10px] font-bold text-yellow-500 mb-1 opacity-70">${n.tipo.toUpperCase()} • ${n.hora}</p>
                    <p class="text-md mb-2 leading-tight">${n.texto}</p>
                    <div class="flex gap-4 border-t border-white/5 pt-2">
                        <button onclick="anunciar('${n.texto.replace(/'/g, "\\'")}')" class="text-blue-400 text-xs font-bold uppercase">Oír</button>
                        <button onclick="borrarNota(${n.id})" class="text-red-500 text-xs font-bold uppercase">Borrar</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        function borrarNota(id) {
            const iso = fechaActual.toISOString().split('T')[0];
            dbReflexiones[iso] = dbReflexiones[iso].filter(n => n.id !== id);
            localStorage.setItem('dev_reflexiones_v7', JSON.stringify(dbReflexiones));
            cargarNotas();
        }

        function actualizarInterfaz() {
            const opciones = { weekday: 'short', day: 'numeric', month: 'short' };
            document.getElementById('fecha-display').innerText = fechaActual.toLocaleDateString('es-ES', opciones).toUpperCase();
            const dia = Math.floor((fechaActual - new Date(fechaActual.getFullYear(), 0, 0)) / 86400000);
            const contenido = temas[dia % temas.length];
            document.getElementById('dev-titulo').innerText = contenido.t;
            document.getElementById('dev-cita').innerText = contenido.c;
            document.getElementById('dev-cuerpo').innerText = contenido.m;
            cargarNotas();
        }

        function navegarFecha(dias) {
            fechaActual.setDate(fechaActual.getDate() + dias);
            cancelarGrabacion();
            actualizarInterfaz();
        }

        function anunciar(texto) {
            synth.cancel();
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = 'es-ES';
            synth.speak(u);
        }

        function detenerVoz() { synth.cancel(); }

        function leerDevocional() {
            const t = document.getElementById('dev-titulo').innerText;
            const m = document.getElementById('dev-cuerpo').innerText;
            anunciar(t + ". " + m);
        }

        window.onload = actualizarInterfaz;
    </script>
</body>
</html>
