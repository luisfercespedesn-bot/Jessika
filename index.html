<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Devocional Accesible 365 - Optimizado Móvil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #000000;
            --text-primary: #FFFFFF;
            --accent: #FFFF00; 
            --focus-outline: #00FF00;
            --recording: #FF3B30; 
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            transition: font-size 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        *:focus {
            outline: 4px solid var(--focus-outline) !important;
            outline-offset: 2px;
        }

        .high-contrast-btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 800;
            padding: 1.25rem;
            border-radius: 16px;
            text-transform: uppercase;
            border: 3px solid #000;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 64px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .recording-active {
            background-color: var(--recording) !important;
            color: white !important;
            border-color: white !important;
            animation: pulse-mobile 1.2s infinite;
        }

        @keyframes pulse-mobile {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(0.95); box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .devotional-card {
            border: 4px solid var(--accent);
            padding: 1.5rem;
            border-radius: 20px;
            background-color: #0a0a0a;
        }

        .calendar-nav {
            background-color: #1a1a1a;
            border-radius: 16px;
            padding: 1rem;
            border: 2px solid #333;
        }

        .note-card {
            background-color: #111;
            border-left: 8px solid var(--accent);
            padding: 1.25rem;
            margin-top: 1rem;
            border-radius: 12px;
        }

        textarea {
            background-color: #1a1a1a;
            color: white;
            border: 3px solid var(--accent);
            padding: 1rem;
            width: 100%;
            border-radius: 12px;
            font-size: 1.2rem;
            appearance: none;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-4xl mx-auto mb-6">
        <h1 id="main-title" class="text-4xl md:text-6xl font-black mb-6 text-center" tabindex="0">
            Devocional 365
        </h1>
        
        <nav class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-8" aria-label="Menú principal">
            <button onclick="leerDevocional()" class="high-contrast-btn">🔊 Escuchar</button>
            <button onclick="cambiarFuente(4)" class="high-contrast-btn">A+ Texto</button>
            <button onclick="cambiarFuente(-4)" class="high-contrast-btn">A- Texto</button>
            <button onclick="detenerVoz()" class="high-contrast-btn bg-white" style="background-color: #fff;">🛑 Parar</button>
        </nav>

        <section class="calendar-nav flex flex-col sm:flex-row items-center justify-between gap-4" aria-label="Calendario">
            <button onclick="navegarFecha(-1)" class="high-contrast-btn sm:w-1/3" aria-label="Ayer">⬅️ Anterior</button>
            <div class="text-center py-2">
                <p id="fecha-display" class="text-xl font-bold text-yellow-400" aria-live="polite" tabindex="0">Cargando...</p>
                <button onclick="irAHoy()" class="mt-1 text-blue-400 underline font-bold" aria-label="Hoy">Volver a Hoy</button>
            </div>
            <button onclick="navegarFecha(1)" class="high-contrast-btn sm:w-1/3" aria-label="Mañana">Siguiente ➡️</button>
        </section>
    </header>

    <main class="max-w-4xl mx-auto">
        <article id="devocional-contenedor" class="devotional-card mb-8" aria-live="polite">
            <h2 id="dev-titulo" class="text-2xl md:text-3xl font-black mb-4 text-yellow-400" tabindex="0">Título</h2>
            <p id="dev-cita" class="text-xl md:text-2xl italic mb-6 text-gray-300 border-l-4 border-yellow-600 pl-4" tabindex="0">Cita</p>
            <div id="dev-cuerpo" class="text-lg md:text-xl space-y-4" tabindex="0"></div>
        </article>

        <section class="p-6 bg-zinc-900 rounded-2xl border-2 border-yellow-500">
            <h2 class="text-2xl font-bold mb-6 text-center" tabindex="0">Diario Personal</h2>
            
            <div class="flex flex-col gap-4 items-center mb-8">
                <button id="btn-dictar" onclick="gestionarDictado()" class="high-contrast-btn py-10 text-3xl shadow-xl" style="background-color: #2563eb; color: white;">
                    <span id="icon-dictar" class="mr-3">🎤</span> 
                    <span id="text-dictar">Tocar para Hablar</span>
                </button>
                <p id="status-dictado" class="text-2xl font-black text-red-500 h-8" aria-live="assertive"></p>
            </div>

            <div class="mb-6">
                <textarea id="input-escritura" rows="3" placeholder="O escribe aquí tus pensamientos..." aria-label="Escribir reflexión"></textarea>
                <button onclick="guardarEscritura()" class="high-contrast-btn mt-3 bg-emerald-600 text-white" style="background-color: #059669; color: white;">💾 Guardar Texto Escrito</button>
            </div>

            <div id="lista-notas" class="space-y-4"></div>
        </section>
    </main>

    <script>
        const temas = [
            { t: "La Esperanza", c: "Hebreos 11:1", m: "La fe es la certeza de lo que se espera. Mantén tu esperanza viva hoy." },
            { t: "Paz Infinita", c: "Filipenses 4:7", m: "La paz de Dios sobrepasa todo entendimiento. Deja tus cargas en sus manos." },
            { t: "Amor Incondicional", c: "1 Juan 4:8", m: "Dios es amor. En cada detalle de tu día, busca su cariño protector." },
            { t: "Fortaleza Diaria", c: "Isaías 40:31", m: "Los que esperan en el Señor tendrán nuevas fuerzas." },
            { t: "Luz en el Camino", c: "Salmos 119:105", m: "Tu palabra es lámpara a mis pies y lumbrera a mi camino." }
        ];

        let fechaActual = new Date();
        let fontSize = 20;
        let grabacionActiva = false;
        const synth = window.speechSynthesis;
        let recognition = null;

        // Función para inicializar/re-inicializar el reconocimiento
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;

            const rec = new SpeechRecognition();
            rec.lang = 'es-ES';
            rec.continuous = false;
            rec.interimResults = false;

            rec.onstart = () => {
                grabacionActiva = true;
                actualizarBotonGrabacion(true);
                // No anunciamos por voz AQUÍ para no interferir con la grabación
            };

            rec.onresult = (event) => {
                if (event.results.length > 0) {
                    const texto = event.results[0][0].transcript;
                    if (texto.trim()) {
                        guardarNota(texto, 'voz');
                    }
                }
            };

            rec.onerror = (event) => {
                console.error("Error Speech:", event.error);
                grabacionActiva = false;
                actualizarBotonGrabacion(false);
                if (event.error !== 'no-speech') {
                    anunciar("Error de micrófono. Intente de nuevo.");
                }
            };

            rec.onend = () => {
                grabacionActiva = false;
                actualizarBotonGrabacion(false);
            };

            return rec;
        }

        window.onload = () => {
            actualizarInterfaz();
            anunciar("Sistema de devocional iniciado.");
        };

        function gestionarDictado() {
            // Cancelamos cualquier lectura actual para que el micro no capte la voz del móvil
            synth.cancel();

            if (grabacionActiva) {
                if (recognition) recognition.stop();
                return;
            }

            // Re-instanciamos para asegurar un objeto limpio en móvil
            recognition = initRecognition();
            
            if (!recognition) {
                anunciar("Su navegador no permite grabación.");
                return;
            }

            try {
                recognition.start();
            } catch (e) {
                console.error("Error al iniciar:", e);
                recognition.stop();
            }
        }

        function actualizarBotonGrabacion(estaGrabando) {
            const btn = document.getElementById('btn-dictar');
            const texto = document.getElementById('text-dictar');
            const status = document.getElementById('status-dictado');

            if (estaGrabando) {
                btn.classList.add('recording-active');
                texto.innerText = "Parar y Guardar";
                status.innerText = "● ESCUCHANDO...";
            } else {
                btn.classList.remove('recording-active');
                texto.innerText = "Tocar para Hablar";
                status.innerText = "";
            }
        }

        function guardarNota(texto, tipo) {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_v4_storage') || '{}');
            
            if (!db[iso]) db[iso] = [];
            
            db[iso].push({ 
                id: Date.now(), 
                texto: texto, 
                tipo: tipo, 
                hora: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) 
            });
            
            localStorage.setItem('dev_v4_storage', JSON.stringify(db));
            cargarNotas();
            anunciar("Nota guardada.");
        }

        function cargarNotas() {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_v4_storage') || '{}');
            const notas = db[iso] || [];
            const lista = document.getElementById('lista-notas');
            
            lista.innerHTML = notas.length ? '' : '<p class="text-center opacity-50 text-xl py-4">Sin notas hoy.</p>';
            
            notas.slice().reverse().forEach(n => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.innerHTML = `
                    <p class="text-yellow-500 font-bold mb-1">${n.tipo === 'voz' ? '🎤 Voz' : '✏️ Texto'} - ${n.hora}</p>
                    <p class="text-2xl mb-3">${n.texto}</p>
                    <div class="flex gap-6">
                        <button onclick="anunciar('${n.texto}')" class="text-blue-400 font-black text-xl underline py-2">OÍR</button>
                        <button onclick="borrarNota(${n.id})" class="text-red-500 font-black text-xl underline py-2">BORRAR</button>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        // --- Funciones de Utilidad ---
        function obtenerDevocional(fecha) {
            const dia = Math.floor((fecha - new Date(fecha.getFullYear(), 0, 0)) / 86400000);
            const tema = temas[dia % temas.length];
            return { titulo: tema.t, cita: tema.c, cuerpo: tema.m };
        }

        function actualizarInterfaz() {
            const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('fecha-display').innerText = fechaActual.toLocaleDateString('es-ES', opciones);
            const contenido = obtenerDevocional(fechaActual);
            document.getElementById('dev-titulo').innerText = contenido.titulo;
            document.getElementById('dev-cita').innerText = contenido.cita;
            document.getElementById('dev-cuerpo').innerText = contenido.cuerpo;
            cargarNotas();
        }

        function navegarFecha(dias) {
            fechaActual.setDate(fechaActual.getDate() + dias);
            actualizarInterfaz();
            anunciar(document.getElementById('fecha-display').innerText);
        }

        function irAHoy() {
            fechaActual = new Date();
            actualizarInterfaz();
            anunciar("Hoy.");
        }

        function leerDevocional() {
            const t = document.getElementById('dev-titulo').innerText;
            const c = document.getElementById('dev-cita').innerText;
            const m = document.getElementById('dev-cuerpo').innerText;
            anunciar(`${t}. ${c}. ${m}`);
        }

        function anunciar(texto) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        function detenerVoz() {
            synth.cancel();
            if (grabacionActiva && recognition) recognition.stop();
        }

        function cambiarFuente(delta) {
            fontSize += delta;
            fontSize = Math.max(16, Math.min(60, fontSize));
            document.body.style.fontSize = fontSize + 'px';
            anunciar("Tamaño de letra cambiado.");
        }

        function guardarEscritura() {
            const texto = document.getElementById('input-escritura').value.trim();
            if (texto) {
                guardarNota(texto, 'escrito');
                document.getElementById('input-escritura').value = '';
            }
        }

        function borrarNota(id) {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_v4_storage') || '{}');
            db[iso] = db[iso].filter(n => n.id !== id);
            localStorage.setItem('dev_v4_storage', JSON.stringify(db));
            cargarNotas();
            anunciar("Eliminado.");
        }
    </script>
</body>
</html>
