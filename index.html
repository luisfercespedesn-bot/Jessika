<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocional Accesible 365</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-primary: #000000;
            --text-primary: #FFFFFF;
            --accent: #FFFF00; 
            --focus-outline: #00FF00;
            --recording: #EF4444;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            transition: font-size 0.2s ease;
        }

        *:focus {
            outline: 5px solid var(--focus-outline) !important;
            outline-offset: 4px;
        }

        .high-contrast-btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 800;
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            text-transform: uppercase;
            border: 3px solid #000;
            font-size: 1.2rem;
        }

        .recording-active {
            background-color: var(--recording) !important;
            color: white !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .devotional-card {
            border: 5px solid var(--accent);
            padding: 2.5rem;
            border-radius: 20px;
            background-color: #0a0a0a;
            box-shadow: 0 10px 30px rgba(255, 255, 0, 0.1);
        }

        .calendar-nav {
            background-color: #1a1a1a;
            border-radius: 15px;
            padding: 2rem;
            border: 3px solid #333;
        }

        .note-card {
            background-color: #111;
            border-left: 10px solid var(--accent);
            padding: 1.5rem;
            margin-top: 1.5rem;
            border-radius: 0 10px 10px 0;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-5xl mx-auto mb-10">
        <h1 id="main-title" class="text-5xl md:text-7xl font-black mb-6 text-center" tabindex="0">
            Devocional 365
        </h1>
        
        <nav class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-10" aria-label="Menú principal">
            <button onclick="leerDevocional()" class="high-contrast-btn" aria-label="Escuchar devocional de hoy">
                🔊 Escuchar Contenido
            </button>
            <button onclick="cambiarFuente(5)" class="high-contrast-btn" aria-label="Letra más grande">
                A+ Aumentar
            </button>
            <button onclick="cambiarFuente(-5)" class="high-contrast-btn" aria-label="Letra más pequeña">
                A- Disminuir
            </button>
            <button onclick="detenerVoz()" class="high-contrast-btn bg-white" style="background-color: #fff;" aria-label="Detener toda la voz">
                🛑 Detener Voz
            </button>
        </nav>

        <section class="calendar-nav flex flex-col md:flex-row items-center justify-between gap-6" aria-label="Navegador de calendario">
            <button onclick="navegarFecha(-1)" class="high-contrast-btn w-full md:w-auto" aria-label="Día anterior">
                ⬅️ Anterior
            </button>
            
            <div class="text-center">
                <p id="fecha-display" class="text-3xl font-bold text-yellow-400" aria-live="polite" tabindex="0">
                    Calculando fecha...
                </p>
                <button onclick="irAHoy()" class="mt-2 text-blue-400 underline font-bold text-xl" aria-label="Volver al día de hoy">Volver a Hoy</button>
            </div>

            <button onclick="navegarFecha(1)" class="high-contrast-btn w-full md:w-auto" aria-label="Día siguiente">
                Siguiente ➡️
            </button>
        </section>
    </header>

    <main class="max-w-5xl mx-auto">
        <!-- Contenido del Devocional -->
        <article id="devocional-contenedor" class="devotional-card mb-12" aria-live="polite">
            <h2 id="dev-titulo" class="text-4xl font-black mb-6 text-yellow-400 border-b-4 border-yellow-900 pb-2" tabindex="0">
                Título del Mensaje
            </h2>
            <p id="dev-cita" class="text-3xl italic mb-8 text-gray-300" tabindex="0">
                Cita Bíblica
            </p>
            <div id="dev-cuerpo" class="text-2xl space-y-6 leading-relaxed" tabindex="0">
                <!-- Contenido generado por JS -->
            </div>
        </article>

        <!-- Grabadora de Notas -->
        <section class="mt-12 p-8 bg-zinc-900 rounded-3xl border-4 border-yellow-500">
            <h2 class="text-4xl font-bold mb-8 text-center" tabindex="0">Diario de Reflexión Personal</h2>
            
            <div class="flex flex-col gap-6 items-center">
                <button id="btn-dictar" onclick="gestionarDictado()" class="high-contrast-btn w-full py-10 text-3xl flex items-center justify-center gap-4" style="background-color: #2563eb; color: white;">
                    <span id="icon-dictar">🎤</span> 
                    <span id="text-dictar">Grabar mi Reflexión</span>
                </button>
                
                <p id="status-dictado" class="text-2xl font-black text-red-500 uppercase h-10" aria-live="assertive"></p>
            </div>

            <div id="lista-notas" class="mt-10 space-y-6">
                <!-- Notas guardadas aparecerán aquí -->
            </div>
        </section>
    </main>

    <script>
        // --- Generador de Contenido para todo el Año ---
        const temas = [
            { t: "La Esperanza", c: "Hebreos 11:1", m: "La fe es la certeza de lo que se espera. Mantén tu esperanza viva hoy." },
            { t: "Paz Infinita", c: "Filipenses 4:7", m: "La paz de Dios sobrepasa todo entendimiento. Deja tus cargas en sus manos." },
            { t: "Amor Incondicional", c: "1 Juan 4:8", m: "Dios es amor. En cada detalle de tu día, busca su cariño protector." },
            { t: "Fortaleza Diaria", c: "Isaías 40:31", m: "Los que esperan en el Señor tendrán nuevas fuerzas. Volarás como las águilas." },
            { t: "Sabiduría Divina", c: "Santiago 1:5", m: "Si te falta sabiduría, pídela a Dios. Él guía tus pasos con inteligencia celestial." }
        ];

        function obtenerDevocional(fecha) {
            // Algoritmo simple para generar un devocional basado en el día del año
            const diaDelAño = Math.floor((fecha - new Date(fecha.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const index = diaDelAño % temas.length;
            const tema = temas[index];
            
            return {
                titulo: `${tema.t} - Día ${diaDelAño}`,
                cita: tema.c,
                cuerpo: `En este día especial, recordamos que ${tema.m} La presencia del Creador te acompaña en cada segundo.`
            };
        }

        // --- Estado de la App ---
        let fechaActual = new Date();
        let fontSize = 28;
        let grabacionActiva = false;
        const synth = window.speechSynthesis;
        let recognition = null;

        // Configurar Reconocimiento de Voz
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;

            recognition.onstart = () => {
                grabacionActiva = true;
                actualizarBotonGrabacion(true);
                anunciar("Grabando. Hable ahora.");
            };

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                guardarNota(texto);
            };

            recognition.onend = () => {
                grabacionActiva = false;
                actualizarBotonGrabacion(false);
            };

            recognition.onerror = () => {
                anunciar("Error al intentar grabar.");
                grabacionActiva = false;
                actualizarBotonGrabacion(false);
            };
        }

        window.onload = () => {
            actualizarInterfaz();
            anunciar("Devocional anual listo. Estás en la fecha de hoy.");
        };

        function gestionarDictado() {
            if (!recognition) {
                anunciar("Su navegador no permite grabar voz.");
                return;
            }

            if (grabacionActiva) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function actualizarBotonGrabacion(estaGrabando) {
            const btn = document.getElementById('btn-dictar');
            const texto = document.getElementById('text-dictar');
            const status = document.getElementById('status-dictado');

            if (estaGrabando) {
                btn.classList.add('recording-active');
                texto.innerText = "Detener y Guardar";
                status.innerText = "● Grabando Voz...";
            } else {
                btn.classList.remove('recording-active');
                texto.innerText = "Grabar mi Reflexión";
                status.innerText = "";
            }
        }

        function navegarFecha(dias) {
            fechaActual.setDate(fechaActual.getDate() + dias);
            actualizarInterfaz();
            const fechaTxt = document.getElementById('fecha-display').innerText;
            anunciar("Fecha cambiada a " + fechaTxt);
        }

        function irAHoy() {
            fechaActual = new Date();
            actualizarInterfaz();
            anunciar("Regresaste al día de hoy.");
        }

        function actualizarInterfaz() {
            const iso = fechaActual.toISOString().split('T')[0];
            const opciones = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('fecha-display').innerText = fechaActual.toLocaleDateString('es-ES', opciones);

            const contenido = obtenerDevocional(fechaActual);
            document.getElementById('dev-titulo').innerText = contenido.titulo;
            document.getElementById('dev-cita').innerText = contenido.cita;
            document.getElementById('dev-cuerpo').innerHTML = `<p>${contenido.cuerpo}</p>`;
            
            cargarNotas();
        }

        function leerDevocional() {
            const t = document.getElementById('dev-titulo').innerText;
            const c = document.getElementById('dev-cita').innerText;
            const m = document.getElementById('dev-cuerpo').innerText;
            anunciar(`Título: ${t}. Lectura: ${c}. Mensaje: ${m}`);
        }

        function anunciar(texto) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function detenerVoz() {
            synth.cancel();
            if (grabacionActiva) recognition.stop();
        }

        function cambiarFuente(delta) {
            fontSize += delta;
            fontSize = Math.max(18, Math.min(80, fontSize));
            document.body.style.fontSize = fontSize + 'px';
            anunciar("Tamaño de texto ajustado");
        }

        // --- Almacenamiento ---
        function guardarNota(texto) {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_365_notas') || '{}');
            
            if (!db[iso]) db[iso] = [];
            db[iso].push({
                id: Date.now(),
                texto: texto,
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });

            localStorage.setItem('dev_365_notas', JSON.stringify(db));
            cargarNotas();
            anunciar("Tu reflexión ha sido guardada.");
        }

        function cargarNotas() {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_365_notas') || '{}');
            const notasHoy = db[iso] || [];
            
            const contenedor = document.getElementById('lista-notas');
            contenedor.innerHTML = '';
            
            if (notasHoy.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-gray-500 text-2xl italic">No hay grabaciones hoy.</p>';
                return;
            }

            notasHoy.reverse().forEach(n => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.tabIndex = 0;
                div.innerHTML = `
                    <p class="text-yellow-500 font-bold text-xl mb-2">Grabado a las ${n.hora}</p>
                    <p class="text-2xl mb-4 font-medium">${n.texto}</p>
                    <div class="flex gap-6">
                        <button onclick="anunciar('${n.texto}')" class="text-blue-400 font-black text-xl underline" aria-label="Escuchar esta grabación">REPRODUCIR</button>
                        <button onclick="borrarNota(${n.id})" class="text-red-500 font-black text-xl underline" aria-label="Borrar esta grabación">BORRAR</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        function borrarNota(id) {
            const iso = fechaActual.toISOString().split('T')[0];
            const db = JSON.parse(localStorage.getItem('dev_365_notas') || '{}');
            db[iso] = db[iso].filter(n => n.id !== id);
            localStorage.setItem('dev_365_notas', JSON.stringify(db));
            cargarNotas();
            anunciar("Grabación eliminada.");
        }
    </script>
</body>
</html>
